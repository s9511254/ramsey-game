<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramsey 避讓遊戲 拓撲與對戰實驗室</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 16px;
    background-color: #f4f6f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .ramsey-container {
    max-width: 840px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  .ramsey-title {
    font-size: 22px;
    font-weight: bold;
    color: #1a1a1a;
    margin-bottom: 6px;
    text-align: center;
  }
  .ramsey-subtitle {
    font-size: 13px;
    color: #666;
    text-align: center;
    margin-bottom: 16px;
  }
  .ramsey-toolbar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    background: #f8f9fa;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #eee;
  }
  .ramsey-btn {
    padding: 6px 14px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.15s ease;
  }
  .btn-red { background: #ffebee; color: #c62828; border-color: #ef9a9a; }
  .btn-red.active { background: #d32f2f; color: #fff; border-color: #b71c1c; }
  .btn-blue { background: #e8eaf6; color: #1a237e; border-color: #9fa8da; }
  .btn-blue.active { background: #283593; color: #fff; border-color: #1a237e; }
  .btn-erase { background: #f5f5f5; color: #424242; border-color: #e0e0e0; }
  .btn-erase.active { background: #616161; color: #fff; }
  .btn-action { background: #ffffff; border: 1px solid #cccccc; color: #333; }
  .btn-action:hover { background: #f0f0f0; }
  .btn-action:disabled { opacity: 0.4; cursor: not-allowed; background: #e0e0e0; }

  .select-box {
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 13px;
    background: #fff;
    font-weight: 600;
  }
  
  .ramsey-svg {
    width: 100%;
    height: 460px;
    background: #fafafa;
    border: 1px solid #e8e8e8;
    border-radius: 8px;
    touch-action: none;
    user-select: none;
  }
  
  .ramsey-status {
    margin-top: 14px;
    padding: 14px 18px;
    border-radius: 8px;
    background: #f1f8e9;
    border-left: 5px solid #558b2f;
    font-size: 14px;
    line-height: 1.6;
  }
  .ramsey-status.warning {
    background: #fff8e1;
    border-left-color: #ff8f00;
  }
  .ramsey-status.danger {
    background: #ffebee;
    border-left-color: #c62828;
  }
  .mine-badge {
    display: inline-block;
    background: #ffecb3;
    color: #b71c1c;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 12px;
    margin: 2px 4px;
    border: 1px solid #ffe082;
  }
  .turn-indicator {
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 12px;
  }
  .turn-user { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
  .turn-ai { background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
</style>
</head>
<body>
<div class="ramsey-container">
  <div class="ramsey-title">Ramsey 避讓遊戲 拓撲與對戰實驗室</div>
  <div class="ramsey-subtitle">🖱️ 按住數字點可任意拖拽 ｜ 👆 點擊兩點劃線 ｜ ↺ 支援全流程上一步/下一步與 AI 對戰</div>
  
  <div class="ramsey-toolbar">
    <span>模式：</span>
    <select id="modeSelect" class="select-box" onchange="onModeChange()">
      <option value="pve">🤖 單人對抗隨機 AI</option>
      <option value="pvp">👥 雙人對戰 / 自由沙盒</option>
    </select>

    <span id="firstPlayerSpan">先手：</span>
    <select id="firstSelect" class="select-box" onchange="resetGame()">
      <option value="human">👤 玩家先手</option>
      <option value="ai">🤖 對手先手</option>
    </select>

    <span style="border-left:1px solid #ccc; height:18px; margin:0 2px;"></span>

    <button id="btnUndo" class="ramsey-btn btn-action" onclick="undo()" disabled>⏮️ 上一步</button>
    <button id="btnRedo" class="ramsey-btn btn-action" onclick="redo()" disabled>⏭️ 下一步</button>

    <span style="border-left:1px solid #ccc; height:18px; margin:0 2px;"></span>

    <span>劃線：</span>
    <button id="btnRed" class="ramsey-btn btn-red active" onclick="setColor('R')">🔴 紅</button>
    <button id="btnBlue" class="ramsey-btn btn-blue" onclick="setColor('B')">🔵 藍</button>
    <button id="btnErase" class="ramsey-btn btn-erase" onclick="setColor('E')">🧹 擦</button>

    <span style="border-left:1px solid #ccc; height:18px; margin:0 2px;"></span>
    <button class="ramsey-btn btn-action" onclick="resetGame()">🔄 開新局</button>
    <button class="ramsey-btn btn-action" onclick="resetCircle()">⭕ 重置圓形</button>
  </div>

  <svg id="svgCanvas" class="ramsey-svg"></svg>

  <div id="statusBox" class="ramsey-status">
    初始化中...
  </div>
</div>

<script>
const N = 6;
const SVG_NS = "http://www.w3.org/2000/svg";
let nodes = [];
let edges = {}; 
let currentColor = 'R';
let selectedNode = null;

let isDragging = false;
let draggedNode = null;
let dragStartX = 0, dragStartY = 0;
let hasDraggedFar = false;

let currentTurn = 'human';
let isGameOver = false;
let history = [];
let historyIndex = 0;

function initNodes() {
  const container = document.getElementById('svgCanvas');
  const rect = container ? container.getBoundingClientRect() : { width: 780, height: 460 };
  const cx = rect.width ? rect.width / 2 : 390;
  const cy = 230;
  const r = 150;
  nodes = [];
  for (let i = 0; i < N; i++) {
    const angle = (i * 2 * Math.PI / N) - (Math.PI / 2);
    nodes.push({
      id: i,
      x: cx + r * Math.cos(angle),
      y: cy + r * Math.sin(angle)
    });
  }
}

function setColor(c) {
  currentColor = c;
  document.getElementById('btnRed').classList.toggle('active', c === 'R');
  document.getElementById('btnBlue').classList.toggle('active', c === 'B');
  document.getElementById('btnErase').classList.toggle('active', c === 'E');
}

function getEdgeKey(u, v) {
  return u < v ? `${u}-${v}` : `${v}-${u}`;
}

function onModeChange() {
  const mode = document.getElementById('modeSelect').value;
  const firstSpan = document.getElementById('firstPlayerSpan');
  const firstSelect = document.getElementById('firstSelect');
  if (mode === 'pvp') {
    firstSpan.style.display = 'none';
    firstSelect.style.display = 'none';
  } else {
    firstSpan.style.display = 'inline';
    firstSelect.style.display = 'inline';
  }
  resetGame();
}

function saveState() {
  history = history.slice(0, historyIndex + 1);
  history.push({
    edges: JSON.parse(JSON.stringify(edges)),
    currentTurn: currentTurn,
    isGameOver: isGameOver
  });
  historyIndex = history.length - 1;
  updateUndoRedoBtns();
}

function updateUndoRedoBtns() {
  document.getElementById('btnUndo').disabled = (historyIndex <= 0);
  document.getElementById('btnRedo').disabled = (historyIndex >= history.length - 1);
}

function undo() {
  if (historyIndex > 0) {
    historyIndex--;
    applyState(history[historyIndex]);
  }
}

function redo() {
  if (historyIndex < history.length - 1) {
    historyIndex++;
    applyState(history[historyIndex]);
  }
}

function applyState(state) {
  edges = JSON.parse(JSON.stringify(state.edges));
  currentTurn = state.currentTurn;
  isGameOver = state.isGameOver;
  selectedNode = null;
  render();
  updateUndoRedoBtns();
}

function resetGame() {
  edges = {};
  selectedNode = null;
  isGameOver = false;
  
  const mode = document.getElementById('modeSelect').value;
  if (mode === 'pve') {
    const first = document.getElementById('firstSelect').value;
    currentTurn = first;
  } else {
    currentTurn = 'human';
  }

  history = [{
    edges: {},
    currentTurn: currentTurn,
    isGameOver: false
  }];
  historyIndex = 0;
  updateUndoRedoBtns();

  render();

  if (mode === 'pve' && currentTurn === 'ai') {
    setTimeout(makeAIMove, 500);
  }
}

function resetCircle() {
  initNodes();
  selectedNode = null;
  render();
}

function checkK3(color, tempEdges) {
  let triangles = [];
  for (let i = 0; i < N; i++) {
    for (let j = i + 1; j < N; j++) {
      for (let k = j + 1; k < N; k++) {
        if (tempEdges[getEdgeKey(i, j)] === color &&
            tempEdges[getEdgeKey(j, k)] === color &&
            tempEdges[getEdgeKey(i, k)] === color) {
          triangles.push([i, j, k]);
        }
      }
    }
  }
  return triangles;
}

function analyzeBoard() {
  const redK3 = checkK3('R', edges);
  const blueK3 = checkK3('B', edges);
  
  let doubleMines = [];
  let redMines = [];
  let blueMines = [];

  for (let u = 0; u < N; u++) {
    for (let v = u + 1; v < N; v++) {
      const key = getEdgeKey(u, v);
      if (!edges[key]) {
        const testRed = { ...edges, [key]: 'R' };
        const createsRedK3 = checkK3('R', testRed).length > 0;
        
        const testBlue = { ...edges, [key]: 'B' };
        const createsBlueK3 = checkK3('B', testBlue).length > 0;

        if (createsRedK3 && createsBlueK3) {
          doubleMines.push([u, v]);
        } else if (createsRedK3) {
          redMines.push([u, v]);
        } else if (createsBlueK3) {
          blueMines.push([u, v]);
        }
      }
    }
  }

  return { redK3, blueK3, doubleMines, redMines, blueMines };
}

function makeAIMove() {
  if (isGameOver) return;

  const mode = document.getElementById('modeSelect').value;
  if (mode !== 'pve' || currentTurn !== 'ai') return;

  let remainingEdges = [];
  for (let u = 0; u < N; u++) {
    for (let v = u + 1; v < N; v++) {
      const key = getEdgeKey(u, v);
      if (!edges[key]) {
        remainingEdges.push([u, v]);
      }
    }
  }

  if (remainingEdges.length === 0) return;

  let safeChoices = [];
  let allChoices = [];

  remainingEdges.forEach(([u, v]) => {
    const key = getEdgeKey(u, v);
    ['R', 'B'].forEach(c => {
      allChoices.push({ u, v, key, color: c });
      const testEdges = { ...edges, [key]: c };
      if (checkK3('R', testEdges).length === 0 && checkK3('B', testEdges).length === 0) {
        safeChoices.push({ u, v, key, color: c });
      }
    });
  });

  let chosen;
  if (safeChoices.length > 0) {
    chosen = safeChoices[Math.floor(Math.random() * safeChoices.length)];
  } else {
    chosen = allChoices[Math.floor(Math.random() * allChoices.length)];
  }

  edges[chosen.key] = chosen.color;
  currentTurn = 'human';

  const analysis = analyzeBoard();
  if (analysis.redK3.length > 0 || analysis.blueK3.length > 0) {
    isGameOver = true;
  }

  saveState();
  render();
}

function render() {
  const svg = document.getElementById('svgCanvas');
  if (!svg) return;
  svg.innerHTML = '';

  const analysis = analyzeBoard();
  const drawnCount = Object.keys(edges).length;

  if (analysis.redK3.length > 0 || analysis.blueK3.length > 0) {
    isGameOver = true;
  }

  // 1. 底圖未劃線
  for (let u = 0; u < N; u++) {
    for (let v = u + 1; v < N; v++) {
      const key = getEdgeKey(u, v);
      if (!edges[key]) {
        const line = document.createElementNS(SVG_NS, 'line');
        line.setAttribute('x1', nodes[u].x);
        line.setAttribute('y1', nodes[u].y);
        line.setAttribute('x2', nodes[v].x);
        line.setAttribute('y2', nodes[v].y);

        const isDoubleMine = analysis.doubleMines.some(([a, b]) => (a === u && b === v));
        if (isDoubleMine) {
          line.setAttribute('stroke', '#ff9800');
          line.setAttribute('stroke-width', '4');
          line.setAttribute('stroke-dasharray', '6 4');
        } else {
          line.setAttribute('stroke', '#e0e0e0');
          line.setAttribute('stroke-width', '1.5');
          line.setAttribute('stroke-dasharray', '3 3');
        }
        svg.appendChild(line);
      }
    }
  }

  // 2. 已劃線條
  for (const [key, color] of Object.entries(edges)) {
    const [u, v] = key.split('-').map(Number);
    const line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', nodes[u].x);
    line.setAttribute('y1', nodes[u].y);
    line.setAttribute('x2', nodes[v].x);
    line.setAttribute('y2', nodes[v].y);
    line.setAttribute('stroke', color === 'R' ? '#d32f2f' : '#1976d2');
    line.setAttribute('stroke-width', '5');
    line.setAttribute('stroke-linecap', 'round');
    svg.appendChild(line);
  }

  // 3. 頂點與手勢
  nodes.forEach((node) => {
    const g = document.createElementNS(SVG_NS, 'g');
    g.style.cursor = 'grab';

    const circle = document.createElementNS(SVG_NS, 'circle');
    circle.setAttribute('cx', node.x);
    circle.setAttribute('cy', node.y);
    circle.setAttribute('r', '20');
    circle.setAttribute('fill', selectedNode === node.id ? '#fff59d' : '#ffffff');
    circle.setAttribute('stroke', selectedNode === node.id ? '#fbc02d' : '#424242');
    circle.setAttribute('stroke-width', selectedNode === node.id ? '3.5' : '2');

    const text = document.createElementNS(SVG_NS, 'text');
    text.setAttribute('x', node.x);
    text.setAttribute('y', node.y + 5);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('font-weight', 'bold');
    text.setAttribute('font-size', '15px');
    text.setAttribute('fill', '#212121');
    text.setAttribute('pointer-events', 'none');
    text.textContent = node.id;

    g.appendChild(circle);
    g.appendChild(text);

    g.addEventListener('mousedown', (e) => startDrag(e, node.id));
    g.addEventListener('touchstart', (e) => startDrag(e, node.id), {passive: false});

    svg.appendChild(g);
  });

  // 4. 戰術診斷區
  const statusBox = document.getElementById('statusBox');
  const mode = document.getElementById('modeSelect').value;

  let turnBanner = "";
  if (mode === 'pve' && !isGameOver) {
    if (currentTurn === 'human') {
      turnBanner = `<span class="turn-indicator turn-user">👉 輪到您落子 (👤 玩家回合)</span><br>`;
    } else {
      turnBanner = `<span class="turn-indicator turn-ai">🤖 對手思考落子中...</span><br>`;
    }
  }

  if (isGameOver) {
    statusBox.className = 'ramsey-status danger';
    let msg = `<strong>💥【踩雷爆彈！棋局結束】</strong><br>`;
    if (analysis.redK3.length > 0) msg += `🔴 出現紅色三角形：頂點 ${analysis.redK3.map(t=>`(${t.join(',')})`).join(', ')}<br>`;
    if (analysis.blueK3.length > 0) msg += `🔵 出現藍色三角形：頂點 ${analysis.blueK3.map(t=>`(${t.join(',')})`).join(', ')}<br>`;
    
    if (mode === 'pve') {
      if (currentTurn === 'human') {
        msg += `<strong style="color:#2e7d32; font-size:16px;">🎉 恭喜您獲得勝利！對手踩雷爆彈了！</strong>`;
      } else {
        msg += `<strong style="color:#c62828; font-size:16px;">❌ 您踩雷爆彈了，對手獲得勝利！</strong>`;
      }
    } else {
      msg += `最後劃線者當場踩雷輸棋！`;
    }
    statusBox.innerHTML = msg;
  } else if (analysis.doubleMines.length >= 2) {
    statusBox.className = 'ramsey-status warning';
    let msg = turnBanner + `<strong>🔥【雙重地雷 Fork 絕殺觸發！】（已劃 ${drawnCount} 條線）</strong><br>`;
    msg += `盤面已形成 <strong>${analysis.doubleMines.length} 條雙向絕對地雷邊</strong>：`;
    analysis.doubleMines.forEach(([u, v]) => {
      msg += `<span class="mine-badge">💣 邊 (${u}, ${v})</span>`;
    });
    msg += `<br>👉 盤面陷入必敗絕境！無論誰劃哪一條地雷邊、塗什麼顏色，都逃不過踩雷結局。`;
    statusBox.innerHTML = msg;
  } else if (analysis.doubleMines.length === 1) {
    statusBox.className = 'ramsey-status warning';
    const [u, v] = analysis.doubleMines;
    statusBox.innerHTML = turnBanner + `<strong>⚠️【出現 1 條雙向絕對地雷邊】（已劃 ${drawnCount} 條線）</strong><br>` +
      `💣 边 <strong>(${u}, ${v})</strong> 已成為雙向死穴！塗紅或塗藍皆會連成三角形。`;
  } else {
    statusBox.className = 'ramsey-status';
    statusBox.innerHTML = turnBanner + `<strong>⚖️【盤面安全對峙中】（已劃 ${drawnCount} 條線）</strong><br>` +
      `目前尚未產生雙向地雷。點擊兩點劃線，或拖拽數字點改變盤面外觀！`;
  }
}

function startDrag(e, nodeId) {
  e.preventDefault();
  isDragging = true;
  draggedNode = nodeId;
  hasDraggedFar = false;
  const pt = getEventPos(e);
  dragStartX = pt.x;
  dragStartY = pt.y;
}

function onMove(e) {
  if (!isDragging || draggedNode === null) return;
  const pt = getEventPos(e);
  const dx = pt.x - dragStartX;
  const dy = pt.y - dragStartY;

  if (Math.sqrt(dx*dx + dy*dy) > 4) {
    hasDraggedFar = true;
  }

  const svg = document.getElementById('svgCanvas');
  const rect = svg.getBoundingClientRect();
  
  nodes[draggedNode].x = Math.max(25, Math.min(rect.width - 25, pt.x));
  nodes[draggedNode].y = Math.max(25, Math.min(rect.height - 25, pt.y));
  
  render();
}

function endDrag(e) {
  if (!isDragging) return;
  if (!hasDraggedFar && draggedNode !== null) {
    onNodeClick(draggedNode);
  }
  isDragging = false;
  draggedNode = null;
}

function onNodeClick(nodeId) {
  if (isGameOver) return;
  const mode = document.getElementById('modeSelect').value;
  if (mode === 'pve' && currentTurn !== 'human') return;

  if (selectedNode === null) {
    selectedNode = nodeId;
  } else if (selectedNode === nodeId) {
    selectedNode = null;
  } else {
    const key = getEdgeKey(selectedNode, nodeId);
    if (currentColor === 'E') {
      delete edges[key];
      saveState();
    } else {
      if (edges[key]) {
        selectedNode = null;
        render();
        return;
      }
      edges[key] = currentColor;
      
      const analysis = analyzeBoard();
      if (analysis.redK3.length > 0 || analysis.blueK3.length > 0) {
        isGameOver = true;
      }

      if (mode === 'pve') {
        currentTurn = 'ai';
        saveState();
        render();
        if (!isGameOver) {
          setTimeout(makeAIMove, 500);
        }
        selectedNode = null;
        return;
      } else {
        saveState();
      }
    }
    selectedNode = null;
  }
  render();
}

function getEventPos(e) {
  const svg = document.getElementById('svgCanvas');
  const rect = svg.getBoundingClientRect();
  const clientX = e.touches ? e.touches.clientX : e.clientX;
  const clientY = e.touches ? e.touches.clientY : e.clientY;
  return {
    x: clientX - rect.left,
    y: clientY - rect.top
  };
}

window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', endDrag);
window.addEventListener('touchmove', onMove, {passive: false});
window.addEventListener('touchend', endDrag);

window.addEventListener('load', () => {
  initNodes();
  resetGame();
});
</script>
</body>
</html>
